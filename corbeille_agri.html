<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Corbeille — AgriPilot</title>
        <link rel="stylesheet" href="bootstrap-4.0.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="agri.css">
    </head>
    <body>
        <main class="app-shell">
            <header class="topbar mb-4">
                <div class="brand">
                    <span class="brand-mark">🗑️</span>AgriPilot — Corbeille
                </div>
                <nav class="mt-3">
                    <a class="nav-link-app" href="index.html">Accueil</a><a class="nav-link-app" href="gestion_charges_agri.html">Charges</a>
                    <a class="nav-link-app" href="produit_charge_agricol.html">Produits</a>
                    <a class="nav-link-app" href="tableau_bord_agri.html">Tableau de bord</a>
                    <a class="nav-link-app" href="recherche_agri.html">Recherche</a>
                </nav>
            </header>
            <div class="d-flex justify-content-between">
                <div>
                    <h1 class="h3 font-weight-bold">Éléments supprimés</h1>
                    <p class="text-muted">Les éléments sont conservés pendant 30 jours avant suppression définitive.</p>
                </div>
                <button class="btn btn-outline-danger mb-3" onclick="emptyTrash()">Vider la corbeille</button>
            </div>
            <section class="card section-card">
                <div id="trashList"></div>
            </section>
        </main>
        <script>const K='agri_corbeille';
            let t=[];try{t=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){};
            let limit=Date.now()-30*864e5;t=t.filter(x=>x.deletedAt>limit);
            localStorage.setItem(K,JSON.stringify(t));
            const esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
            function render(){trashList.innerHTML=t.length?t.map(x=>`<article class="note-item"><strong>${esc(x.kind)} — ${esc(x.label)}
            </strong><small class="d-block text-muted">Supprimé le ${new Date(x.deletedAt).toLocaleDateString('fr-FR')} • expiration le 
            ${new Date(x.deletedAt+30*864e5).toLocaleDateString('fr-FR')}</small><button class="btn btn-sm btn-outline-success mt-2" onclick="restore('${x.id}')">Restaurer</button></article>`).join(''):'<p class="empty">La corbeille est vide.</p>'}
            function restore(id){let x=t.find(x=>x.id===id),key=x.type==='charge'?'charges_agri_pro':x.type==='produit'?'produits_agri':'notes_agri_pro',a=JSON.parse(localStorage.getItem(key)||'[]');a.push(x.data);localStorage.setItem(key,JSON.stringify(a));t=t.filter(x=>x.id!==id);
            localStorage.setItem(K,JSON.stringify(t));
            render()}render()
            function emptyTrash(){if(!t.length)return; if(confirm('Vider définitivement toute la corbeille ? Cette action est irréversible.')){t=[];localStorage.setItem(K,'[]');render()}}
            
            </script>
            </body>
            </html>
