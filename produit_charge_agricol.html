<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgriPilot — Produits</title>
<link rel="stylesheet" href="bootstrap-4.0.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="agri.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar mb-4">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between">
                <div class="brand">
                    <span class="brand-mark">🌿</span>AgriPilot</div>
                    <nav class="mt-3 mt-md-0">
                        <a class="nav-link-app" href="gestion_charges_agri.html">Charges</a>
                        <a class="nav-link-app active" href="produit_charge_agricol.html">Produits</a>
                        <a class="nav-link-app" href="tableau_bord_agri.html">Tableau de bord</a>
                        <a class="nav-link-app" href="notes_agri.html">Notes</a>
                    </nav>
                </div>
            </header>
            <div class="mb-4">
                <h1 class="h3 font-weight-bold mb-1">Gestion des produits</h1>
                <p class="text-muted mb-0">Enregistrez les ventes de votre exploitation.</p>
            </div>
            <div class="row">
                <section class="col-lg-4 mb-4">
                    <div class="card section-card h-100">
                        <h2 class="section-title">Nouvelle vente</h2>
                        <form id="formProduit">
                            <div class="form-group">
                                <label>Date</label>
                                <input type="date" id="p_date" class="form-control" required></div>
                                <div class="form-group">
                                    <label>Produit</label>
                                    <input id="p_nom" class="form-control" placeholder="Ex. Tomates fraîches" required>
                                </div>
                                <div class="form-row">
                                    <div class="form-group col-6">
                                        <label>Quantité vendue</label>
                                        <input type="number" id="p_vendue" min="0" step="any" class="form-control" required>
                                    </div>
                                    <div class="form-group col-6">
                                        <label>Quantité perdue</label>
                                        <input type="number" id="p_perdue" min="0" step="any" value="0" class="form-control">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Prix unitaire (FCFA)</label>
                                    <input type="number" id="p_prix" min="0" class="form-control" required>
                                </div>
                                <div class="alert alert-light border py-2">Chiffre d’affaires : <strong id="caPreview">0 FCFA</strong>
                                </div>
                                <button class="btn btn-agri btn-block">Enregistrer la vente</button>
                            </form>
                        </div>
                    </section>
                    <section class="col-lg-8 mb-4">
                        <div class="card section-card h-100">
                            <div class="d-flex justify-content-between">
                                <h2 class="section-title">Historique des ventes</h2>
                                <span id="countOps" class="badge badge-light p-2"></span>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead><tr>
                                        <th>Date</th>
                                        <th>Produit</th>
                                        <th>Vendue</th>
                                        <th>Perdue</th>
                                        <th>Prix unitaire</th>
                                        <th>CA</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="tableProduit"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
        <script src="agri-produits.js"></script>
</body>
</html>
